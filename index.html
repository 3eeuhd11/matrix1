<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANONYMOUS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="maskCanvas"></canvas>

    <script>
        const canvas = document.getElementById('maskCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 700;
        canvas.height = 900;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // วาดรูปทรงหน้ากากเบื้องต้นใน Memory เพื่อคำนวณมิติแสงเงา
        const memCanvas = document.createElement('canvas');
        const memCtx = memCanvas.getContext('2d');
        memCanvas.width = canvas.width;
        memCanvas.height = canvas.height;

        memCtx.fillStyle = '#000';
        memCtx.fillRect(0, 0, memCanvas.width, memCanvas.height);

        // โครงหน้ากากฝั่งขวา (ฝั่งซ้ายมืดตามรูปต้นฉบับ)
        memCtx.fillStyle = '#FFF';
        memCtx.beginPath();
        memCtx.ellipse(430, 420, 160, 260, 0, 0, Math.PI * 2);
        memCtx.fill();

        // แก้มและคางส่วนล่าง
        memCtx.beginPath();
        memCtx.moveTo(430, 600);
        memCtx.lineTo(390, 780);
        memCtx.lineTo(470, 750);
        memCtx.closePath();
        memCtx.fill();

        // เจาะเงามืด: คิ้ว เบ้าตา หนวด จมูก รอยยิ้ม และฝั่งซ้าย
        memCtx.fillStyle = '#000';
        // ฝั่งซ้ายบังมืด
        memCtx.fillRect(0, 0, 360, 900);
        // เบ้าตาขวา
        memCtx.beginPath();
        memCtx.ellipse(440, 370, 40, 20, -0.2, 0, Math.PI * 2);
        memCtx.fill();
        // โหนกคิ้วหนา
        memCtx.beginPath();
        memCtx.ellipse(440, 335, 55, 12, -0.2, 0, Math.PI * 2);
        memCtx.fill();
        // หนวดและรอยยิ้ม
        memCtx.beginPath();
        memCtx.ellipse(435, 510, 60, 15, 0.1, 0, Math.PI * 2);
        memCtx.fill();
        memCtx.beginPath();
        memCtx.ellipse(440, 560, 70, 25, 0.1, 0, Math.PI * 2);
        memCtx.fill();
        // เคราคาง
        memCtx.beginPath();
        memCtx.ellipse(405, 710, 15, 45, -0.2, 0, Math.PI * 2);
        memCtx.fill();

        // อ่านค่า Pixel เพื่อเขียนตัวอักษร HACK เรียงตามเงา
        const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const word = "HACK";
        let charIdx = 0;
        const step = 7; // ระยะห่างตัวอักษร ยิ่งเล็กลายยิ่งละเอียด

        for (let y = 100; y < canvas.height - 100; y += step) {
            for (let x = 200; x < canvas.width - 100; x += step) {
                const i = (y * canvas.width + x) * 4;
                const isWhite = data[i] > 128;

                if (isWhite) {
                    // คำนวณความสว่างตามระยะขอบเพื่อสร้างมิติ Gradation 3D
                    let distFromCenter = Math.abs(x - 430) / 160;
                    let alpha = 1 - Math.pow(distFromCenter, 2);
                    if (alpha < 0.2) alpha = 0.2;

                    ctx.fillStyle = `rgba(220, 220, 220, ${alpha})`;
                    ctx.font = `bold ${step + 2}px monospace`;
                    ctx.fillText(word[charIdx % word.length], x, y);
                    charIdx++;
                }
            }
        }
    </script>
</body>
</html>
