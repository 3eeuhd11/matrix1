<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANONYMOUS_HACK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="typographyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('typographyCanvas');
        const ctx = canvas.getContext('2d');

        // ตั้งค่าความละเอียด
        canvas.width = 800;
        canvas.height = 1000;

        const img = new Image();
        // ดึงรูปหน้ากาก Anonymous มาแปลงเป็น Text Typography
        img.crossOrigin = "Anonymous";
        img.src = 'https://i.imgur.com/2s36B3B.png'; // รูปหน้ากากแบบ High Contrast

        img.onload = function() {
            // วาดรูปลง Memory
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const text = "HACK";
            let textIndex = 0;
            const step = 8; // ความถี่ตัวอักษร (ยิ่งน้อย ยิ่งละเอียด)

            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    
                    // คำนวณความสว่าง (Brightness)
                    const brightness = (r + g + b) / 3;

                    if (brightness > 20) { // แสดงเฉพาะส่วนที่มีแสงเงา
                        ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`; // ปรับเป็นโทนขาว-เทาตามรูป หรือเปลี่ยนเป็น `rgb(0, ${brightness}, 0)` เพื่อให้เป็นสีเขียว
                        ctx.font = `${step + 2}px monospace`;
                        ctx.fillText(text[textIndex % text.length], x, y);
                        textIndex++;
                    }
                }
            }
        };
    </script>
</body>
</html>
