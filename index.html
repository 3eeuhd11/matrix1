<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANONYMOUS_TYPOGRAPHY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            max-width: 95vw;
            max-height: 95vh;
        }
    </style>
</head>
<body>

    <canvas id="asciiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // รูป Anonymous สไตล์เดียวกับต้นฉบับสำหรับแปลงเป็น Typography
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = "https://i.imgur.com/2s36B3B.png";

        img.onload = () => {
            const width = 600;
            const height = (img.height / img.width) * width;
            canvas.width = width;
            canvas.height = height;

            // วาดรูปลง Memory Canvas เพื่ออ่านค่าความสว่าง
            const memCanvas = document.createElement('canvas');
            const memCtx = memCanvas.getContext('2d');
            memCanvas.width = width;
            memCanvas.height = height;
            memCtx.drawImage(img, 0, 0, width, height);

            const imgData = memCtx.getImageData(0, 0, width, height);
            const pixels = imgData.data;

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, width, height);

            const text = "HACK";
            let charIndex = 0;
            const step = 6; // ขนาดความละเอียด (ยิ่งน้อยยิ่งละเอียดยิบ)

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const i = (y * width + x) * 4;
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    
                    // คำนวณความสว่างของพิกเซลนั้นๆ
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                    // ถ้าพิกเซลตรงนั้นมีความสว่าง ให้เปลี่ยนเป็นตัวอักษร HACK
                    if (brightness > 15) {
                        ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                        ctx.font = `bold ${step + 1}px monospace`;
                        ctx.fillText(text[charIndex % text.length], x, y);
                        charIndex++;
                    }
                }
            }
        };
    </script>
</body>
</html>
